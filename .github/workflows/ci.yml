# PairPath CI
#
# SCOPE — read this before trusting a green tick.
#
# This is a BUILD AND SMOKE-CHECK pipeline, not a test suite. At the time of
# writing, api/ and frontend/ have no tests at all, and ml-service has two
# scripts rather than a test framework. A passing run means:
#
#   - everything compiles and builds
#   - the trained model loads and classifies five hand-built scenarios correctly
#
# It does NOT verify API endpoints, socket handlers, intervention routing,
# database access, or any frontend behaviour. Those are untested.
#
# When real tests are added, extend the relevant job below and update this
# comment — a CI badge that implies more coverage than exists is worse than
# no badge.

name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      # Generates the Prisma client so TypeScript can resolve its types.
      # Reads schema.prisma only — no database is contacted, but the datasource
      # block requires the variable to be set, hence the placeholder.
      - name: Generate Prisma client
        working-directory: api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Typecheck
        working-directory: api
        run: npx tsc --noEmit

      - name: Build
        working-directory: api
        run: npm run build

      # NOTE: `npm test` is deliberately not run. package.json defines
      # "test": "jest", but there are no test files, no jest config and
      # ts-jest is not installed — it would fail on "no tests found".

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      # NOTE: no test step — the frontend has no test framework installed.

  ml-service:
    name: ML service — compile & model smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: Compile all sources
        working-directory: ml-service
        run: python -m compileall -q app dev_tools

      # Imports the FastAPI app and exercises every route in-process.
      # Needs no database, no network and no environment variables.
      - name: Service starts and routes respond
        working-directory: ml-service
        run: |
          python - <<'PY'
          import json, time, sys
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          assert client.get("/health").status_code == 200

          now = time.time()
          events = [
              {"timestamp": now - 170 + i * 15, "userId": "u1",
               "eventType": "CODE_EDIT", "metadata": "{}"}
              for i in range(11)
          ]
          events.append({"timestamp": now - 60, "userId": "u1",
                         "eventType": "CODE_RUN_RESULT",
                         "metadata": json.dumps({"success": True})})

          r = client.post("/predict-pair-state", json={
              "sessionId": "ci", "events": events,
              "roles": {"u1": "DRIVER", "u2": "NAVIGATOR"}})
          assert r.status_code == 200, r.text
          body = r.json()
          assert body["predictedState"], "no state returned"
          print(f"predict OK -> {body['predictedState']} ({body['modelVersion']})")

          r = client.post("/recommend-intervention", json={
              "sessionId": "ci", "predictedState": "DRIVER_DOMINANCE",
              "confidence": 0.9})
          assert r.json()["action"] == "ROLE_SWITCH_SUPPORT", r.json()

          # Below the confidence gate the engine must stay silent.
          r = client.post("/recommend-intervention", json={
              "sessionId": "ci", "predictedState": "DRIVER_DOMINANCE",
              "confidence": 0.2})
          assert r.json()["action"] == "NO_ACTION", r.json()

          r = client.post("/retrieve-hint", json={
              "sessionId": "ci", "pairId": "", "predictedState": "LOGIC_STRUGGLE",
              "interventionType": "LOGIC_HINT", "questionConceptTags": ["loops"],
              "recentErrorContext": "", "recentCodeSnippet": ""})
          assert r.json()["conceptReminder"], "empty hint"
          print("all routes OK")
          PY

      # Five hand-built scenarios through the real extractor and predictor.
      # Exits non-zero if any scenario is misclassified.
      - name: Model smoke test
        working-directory: ml-service
        run: python dev_tools/test_model.py

      # NOTE: dev_tools/test_rag.py is deliberately not run. Despite the name
      # it contains no assertions and always exits 0, so it would be a green
      # tick that proves nothing. The RAG route is covered above instead.
